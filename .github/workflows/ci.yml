name: 33jack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Check serverless syntax
        run: find api -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check Solana runtime import
        run: node -e "Promise.all([import('@solana/web3.js'), import('@solana/spl-token')]).then(([w]) => { new w.Connection('https://api.devnet.solana.com', 'confirmed'); console.log('solana settlement runtime ok') })"
      - name: Ensure Vercel API function budget and routing
        run: npm run test:vercel
      - name: Test Celo V2 payment security
        run: npm run test:celo
      - name: Test V2 agent and operator security
        run: npm run test:platform
      - name: Smoke backend flow
        run: npm run test:smoke
      - name: Build frontend
        run: npm run build
