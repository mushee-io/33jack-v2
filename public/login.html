<!DOCTYPE html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>33JACK Operator Login</title><style>body{font:16px system-ui;background:#0b1220;color:#fff;min-height:100vh;margin:0;display:grid;place-items:center}main{background:#17243c;border:1px solid #456;padding:32px;border-radius:16px;width:min(420px,85vw)}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0 18px;border:1px solid #76899d;border-radius:8px;font:inherit}button{background:#abf4c6;cursor:pointer}small{color:#bed1dc}</style><main><h1>33JACK</h1><p>Secure finance operator</p><small>Sign in with your configured account, password and authenticator code. Session expires after 15 minutes.</small><form id="f"><label>Operator<input name="operatorId" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><label>Authenticator code<input name="totp" inputmode="numeric" pattern="[0-9]{6}" required></label><button>Sign in</button></form><p id="msg" role="status"></p></main><script>document.getElementById("f").onsubmit=async e=>{e.preventDefault();let msg=document.getElementById("msg");msg.textContent="Verifying…";try{const response=await fetch("/api/v2/auth?operation=login",{method:"POST",headers:{"Content-Type":"application/json"},credentials:"same-origin",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await response.json();if(!response.ok)throw Error(d.error||"Access denied");location.assign("/app/celo");}catch(err){msg.textContent=err.message;}};</script></html>
